<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mentora — Faculty Appointment &amp; Office Hours Portal</title>
  <meta name="description" content="Mentora is a university portal for booking faculty appointments, checking office hours, and staying in touch with your professors." />

  <!-- Google Fonts: Cormorant Garamond (display/serif) + Inter (sans-serif body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
/* =========================================================
   MENTORA — Faculty Appointment Portal
   Stylesheet
   ========================================================= */

/* ---------- 1. RESET ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

img,
svg {
  display: block;
  max-width: 100%;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

ul,
ol {
  list-style: none;
}

/* ---------- 2. VARIABLES ---------- */
:root {
  /* Palette */
  --soft-blush: #E8C5C8;
  --old-rose: #A86670;
  --pale-slate: #B8C4CF;
  --cool-steel: #718090;
  --taupe-grey: #9B918D;
  --ivory: #FAF8F6;
  --dark-text: #293B55;

  /* Derived tones */
  --old-rose-dark: #8E525C;
  --cool-steel-dark: #55636F;
  --card-border-student: #DCA9AE;
  --card-border-faculty: #A5B4C2;
  --white: #FFFFFF;
  --text-muted: #6E7A8A;

  /* Type */
  --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Layout */
  --max-width: 1100px;
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 8px;

  /* Motion */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---------- 3. BODY ---------- */
body {
  background: var(--ivory);
  color: var(--dark-text);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.page {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 40px 24px 32px;
}

/* Visible focus states for accessibility */
a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--old-rose);
  outline-offset: 3px;
  border-radius: 6px;
}

.br-mobile {
  display: none;
}

/* ---------- 4. HEADER / BRAND ---------- */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  margin-bottom: 8px;
}

.brand__logo {
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand__name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: 0.28em;
  color: var(--old-rose);
  text-indent: 0.28em; /* balance the extra right-side tracking space */
}

.brand__divider {
  width: 64px;
  height: 1px;
  background: var(--card-border-student);
  margin-top: 6px;
}

/* ---------- 5. HERO ---------- */
.hero {
  text-align: center;
  padding: 40px 0 36px;
}

.hero__heading {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(34px, 6vw, 52px);
  line-height: 1.18;
  color: var(--dark-text);
  max-width: 720px;
  margin: 0 auto 20px;
}

.hero__subtitle {
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 16px;
  color: var(--text-muted);
  max-width: 460px;
  margin: 0 auto;
}

/* ---------- 6. ROLE CARDS ---------- */
.roles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  max-width: 620px;
  margin: 0 auto 56px;
}

.role-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 34px 18px;
  border-radius: var(--radius-lg);
  border: 1.5px solid transparent;
  text-align: center;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
  min-height: 168px;
  -webkit-tap-highlight-color: transparent;
}

.role-card__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s var(--ease);
}

.role-card__label {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15.5px;
}

.role-card--student {
  background: var(--soft-blush);
  border-color: var(--card-border-student);
  box-shadow: 0 2px 10px rgba(168, 102, 112, 0.12);
}

.role-card--student .role-card__label {
  color: var(--old-rose-dark);
}

.role-card--faculty {
  background: var(--pale-slate);
  border-color: var(--card-border-faculty);
  box-shadow: 0 2px 10px rgba(113, 128, 144, 0.14);
}

.role-card--faculty .role-card__label {
  color: var(--cool-steel-dark);
}

.role-card:hover,
.role-card:focus-visible {
  transform: translateY(-4px);
}

.role-card--student:hover,
.role-card--student:focus-visible {
  border-color: var(--old-rose);
  box-shadow: 0 10px 24px rgba(168, 102, 112, 0.22);
}

.role-card--faculty:hover,
.role-card--faculty:focus-visible {
  border-color: var(--cool-steel);
  box-shadow: 0 10px 24px rgba(113, 128, 144, 0.24);
}

.role-card:hover .role-card__icon,
.role-card:focus-visible .role-card__icon {
  transform: scale(1.08);
}

.role-card:active {
  transform: translateY(-1px) scale(0.99);
}

/* Active / selected state (after click) */
.role-card.is-selected.role-card--student {
  border-color: var(--old-rose);
  box-shadow: 0 10px 26px rgba(168, 102, 112, 0.3);
}

.role-card.is-selected.role-card--faculty {
  border-color: var(--cool-steel);
  box-shadow: 0 10px 26px rgba(113, 128, 144, 0.3);
}

/* ---------- 7. ILLUSTRATION ---------- */
.illustration {
  display: flex;
  justify-content: center;
  margin-bottom: 40px;
}

.illustration__svg {
  width: 100%;
  max-width: 500px;
  height: auto;
}

/* ---------- 8. FOOTER ---------- */
.footer {
  text-align: center;
  padding-top: 24px;
  border-top: 1px solid rgba(155, 145, 141, 0.25);
}

.footer__text {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--taupe-grey);
  text-transform: uppercase;
}

.footer__dots {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}

.footer__line {
  width: 28px;
  height: 1px;
  background: var(--card-border-student);
}

.footer__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--old-rose);
}

/* ---------- 9. ANIMATIONS ---------- */
[data-animate] {
  opacity: 0;
  animation: none;
}

[data-animate="fade-down"] {
  animation: fadeDown 0.7s var(--ease) forwards;
}

[data-animate="fade-up"] {
  animation: fadeUp 0.7s var(--ease) forwards;
}

[data-delay="1"] { animation-delay: 0.1s; }
[data-delay="2"] { animation-delay: 0.2s; }
[data-delay="3"] { animation-delay: 0.32s; }
[data-delay="4"] { animation-delay: 0.44s; }
[data-delay="5"] { animation-delay: 0.56s; }

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-14px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  [data-animate] {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .role-card,
  .role-card__icon {
    transition: none !important;
  }
}

/* ---------- 10. RESPONSIVE DESIGN ---------- */

/* Small phones */
@media (max-width: 380px) {
  .page {
    padding: 32px 16px 28px;
  }

  .brand__name {
    font-size: 24px;
    letter-spacing: 0.22em;
  }

  .hero__heading {
    font-size: 32px;
  }

  .role-card {
    padding: 24px 10px;
    min-height: 148px;
  }

  .role-card__label {
    font-size: 14px;
  }
}

/* Use the natural two-line break on narrow phones, as in the reference */
@media (max-width: 430px) {
  .br-mobile {
    display: inline;
  }

  .hero {
    padding: 32px 0 30px;
  }
}

/* Tablet and up */
@media (min-width: 768px) {
  .page {
    padding: 56px 32px 48px;
  }

  .brand__name {
    font-size: 34px;
  }

  .hero {
    padding: 56px 0 48px;
  }

  .hero__subtitle {
    font-size: 17px;
  }

  .roles {
    max-width: 680px;
    gap: 22px;
    margin-bottom: 68px;
  }

  .role-card {
    padding: 42px 24px;
    min-height: 200px;
  }

  .illustration {
    margin-bottom: 52px;
  }

  .illustration__svg {
    max-width: 560px;
  }
}

/* Desktop — centered layout, not a stretched mobile view */
@media (min-width: 1024px) {
  .page {
    padding: 72px 40px 56px;
  }

  .brand {
    margin-bottom: 4px;
  }

  .hero {
    padding: 64px 0 52px;
  }

  .hero__subtitle {
    max-width: 500px;
  }

  .roles {
    max-width: 720px;
  }

  .role-card {
    padding: 46px 28px;
  }

  .illustration__svg {
    max-width: 620px;
  }

  .footer {
    padding-top: 32px;
  }
}

@media (min-width: 1440px) {
  .page {
    max-width: 1180px;
    padding: 88px 40px 64px;
  }

  .hero__heading {
    font-size: 58px;
  }
}

  </style>

  <script>
/* =========================================================
   MENTORA — Landing Page Interaction
   Handles role selection and navigation to the correct
   login flow for students and faculty.
   ========================================================= */

document.addEventListener('DOMContentLoaded', () => {

  // Map each role to the page it should navigate to.
  // Change these paths later if the login pages move.
  const ROLE_DESTINATIONS = {
    student: 'student-login.html',
    faculty: 'faculty-login.html',
  };

  const roleCards = document.querySelectorAll('.role-card');

  roleCards.forEach((card) => {
    card.addEventListener('click', () => handleRoleSelect(card));

    // Allow activation with Enter/Space when focused (native <button> already
    // supports this, but we keep it explicit for clarity and robustness).
    card.addEventListener('keyup', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        handleRoleSelect(card);
      }
    });
  });

  /**
   * Marks a role card as selected, updates ARIA state,
   * and navigates to the matching destination page.
   * @param {HTMLElement} card
   */
  function handleRoleSelect(card) {
    const role = card.dataset.role;
    const destination = ROLE_DESTINATIONS[role];

    // Clear selection state from all cards, then activate the chosen one.
    roleCards.forEach((c) => {
      c.classList.remove('is-selected');
      c.setAttribute('aria-pressed', 'false');
    });

    card.classList.add('is-selected');
    card.setAttribute('aria-pressed', 'true');

    if (!destination) {
      console.warn(`Mentora: no destination configured for role "${role}".`);
      return;
    }

    // Small delay so the user sees the active/selected state before leaving.
    window.setTimeout(() => {
      navigateTo(destination);
    }, 180);
  }

  /**
   * Centralized navigation helper. Update this if routing
   * strategy changes later (e.g. client-side router, SPA, etc).
   * @param {string} path
   */
  function navigateTo(path) {
    window.location.href = path;
  }

});

  </script>
